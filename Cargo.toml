[package]
name = "assetripper-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-only"
description = "Independent Rust port of AssetRipper"

[lib]
name = "assetripper"
path = "src/lib.rs"

[dependencies]
lzma-rs = { version = "0.3.0", default-features = false, features = ["raw_decoder"] }
ruzstd = { version = "=0.9.0", default-features = false, features = ["std", "hash"] }
brotli-decompressor = "=5.0.3"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
dotnetdll = "=0.3.0"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }
