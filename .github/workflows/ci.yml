name: Rust CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  privacy:
    name: Public repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject private inputs and oversized tracked files
        run: python3 tools/check_public_repository.py

      - name: Scan repository history for credentials
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

  ledger:
    name: Ledger and repository audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Structural integrity of docs/feature-parity.md. The parity report itself
      # exits non-zero while any row is unverified, which is the expected state
      # until the port finishes, so only duplicate IDs and malformed rows gate.
      # Nothing here reads data outside the repository.
      - name: Check the feature ledger structure
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./tools/parity-report.ps1 -OutFile ledger-report.json | Out-Null
          # The parity report exits 1 for any non-verified row, which is the
          # expected state until the port finishes. Capture that status and
          # clear $LASTEXITCODE so the pwsh shell wrapper does not turn the
          # expected open-gate state into a step failure.
          $reportExit = $LASTEXITCODE
          $LASTEXITCODE = 0
          $report = Get-Content -Raw ledger-report.json | ConvertFrom-Json
          Write-Host ("ledger rows: {0}; recognized status cells: {1}; non-verified: {2}; duplicate ids: {3}; malformed rows: {4}; phase-1 gate: {5}; parity report exit: {6}" -f `
            $report.total_rows, $report.recognized_status_rows, $report.non_verified_count, `
            @($report.duplicate_ids).Count, @($report.malformed).Count, $report.phase1_gate, $reportExit)
          if (@($report.duplicate_ids).Count -gt 0) {
            Write-Error 'docs/feature-parity.md contains duplicate stable IDs'
            exit 1
          }
          if (@($report.malformed).Count -gt 0) {
            Write-Error 'docs/feature-parity.md contains malformed ledger rows'
            exit 1
          }
          exit 0

      - name: Report oversized source files
        shell: pwsh
        continue-on-error: true
        run: ./tools/check-source-file-lengths.ps1

  fmt:
    name: Changed Rust formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: rustfmt
      - name: Check formatting in changed Rust lines
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/check_changed_rust_format.py

  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test-and-build:
    name: Tests and release build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_artifact: assetripper-rs-linux-x86_64
            artifact_path: target/release/assetripper-rs-linux-x86_64.tar
            binary_name: assetripper-rs
          - os: windows-latest
            release_artifact: assetripper-rs-windows-x86_64
            artifact_path: target/release/assetripper-rs.exe
            binary_name: assetripper-rs.exe
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: rust_toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --locked
      - name: Build release binaries
        if: ${{ always() && steps.rust_toolchain.outcome == 'success' }}
        run: cargo build --workspace --release --locked
      - name: Package Linux binary with executable mode
        if: ${{ success() && runner.os == 'Linux' }}
        run: tar -cf "${{ matrix.artifact_path }}" -C target/release "${{ matrix.binary_name }}"
      - name: Upload Rust release binary
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.release_artifact }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 30

  # Release-mode tests run the suite against optimized code, where overflow and
  # debug-assertion behavior differs from the debug profile. This is the heaviest
  # job, so it runs once on Linux rather than on every matrix entry.
  release-tests:
    name: Release-mode tests (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source without a persistent token
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
      - run: cargo test --workspace --release --locked
